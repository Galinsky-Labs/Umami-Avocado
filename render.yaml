# Render blueprint (documentation of the deployed free-tier service).
# One service: the FastAPI API also serves the built research console (apps/web/dist) at /.
# Secrets are never committed: values marked sync:false are set in the Render dashboard.
services:
  - type: web
    name: umami-avocado-api
    runtime: python
    plan: free
    region: ohio
    branch: main
    healthCheckPath: /api/health
    buildCommand: >-
      pip install -r services/api/requirements.txt &&
      npx --yes pnpm@9.15.9 install --frozen-lockfile &&
      npx --yes pnpm@9.15.9 --filter @umami/web build
    startCommand: >-
      PYTHONPATH=services/api python -m umami_api.migrate &&
      uvicorn umami_api.main:app --app-dir services/api --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: LAB_LIVE_SUBMISSION_ENABLED
        value: "false"
      - key: LAB_MAX_AUTHORIZED_SPEND_USD
        value: "0"
      - key: EMBEDDED_WORKER         # run the job/outbox worker inside the API process
        value: "true"
      - key: DATABASE_URL            # Neon pooled connection string (runtime)
        sync: false
      - key: DATABASE_MIGRATION_URL  # Neon direct connection string (migrations at start)
        sync: false
      - key: UMAMI_BOOTSTRAP_TOKEN   # one-time first-owner bootstrap secret (>=32 chars)
        sync: false
